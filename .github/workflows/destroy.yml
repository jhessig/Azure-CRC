name: 'Destroy'
on:
  workflow_dispatch:

jobs:
  destroy:
    name: 'Destroy'
    runs-on: ubuntu-latest
    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
      STORAGE_ACCOUNT: ${{ secrets.STORAGE_ACCOUNT }}
      CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      ALERT_SMS: ${{ secrets.ALERT_SMS }}
      CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      KEY_VAULT_NAME: ${{ secrets.KEY_VAULT_NAME }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup Terraform'
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_wrapper: false

      - name: 'Extract branch name'
        shell: bash
        run: |
          branch="${GITHUB_REF#refs/heads/}"
          if [ $branch = "master" ]; then
            branch="prod"
          fi
          echo "branch=$branch" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: 'Terraform Initialize'
        run: |
          terraform init -backend-config="storage_account_name=$STORAGE_ACCOUNT" \
            -backend-config="container_name=$CONTAINER_NAME" \
            -backend-config="resource_group_name=$RESOURCE_GROUP" \
            -backend-config="key=github-${{ steps.extract_branch.outputs.branch }}.terraform.tfstate"

      - name: "Terraform Destroy"
        if: always()
        run: |
          terraform destroy -var="env_tag=${{ steps.extract_branch.outputs.branch }}" \
            -var="key_vault_name=$KEY_VAULT_NAME" \
            -var="key_vault_rg=$RESOURCE_GROUP" \
            -var="alert_email=$ALERT_EMAIL" \
            -var="webhook_url=$WEBHOOK_URL" \
            -var="alert_sms=$ALERT_SMS" \
            -var="cloudflare_api_token=$CLOUDFLARE_TOKEN" \
            -var="cloudflare_zone_id=$CLOUDFLARE_ZONE_ID" \
            -var="domain_name=$DOMAIN_NAME" \
            -auto-approve